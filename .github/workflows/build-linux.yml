name: Build Linux

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Activate flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build Linux installer (.deb)
        run: dart pub global run flutter_distributor:main release --name stable --jobs linux-deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heating_planner-linux-installer
          path: dist/**/*.deb
          if-no-files-found: error
