name: Build macOS

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Activate flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build macOS installer (.dmg)
        run: dart pub global run flutter_distributor:main release --name stable --jobs macos-dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: heating_planner-macos-installer
          path: dist/**/*.dmg
          if-no-files-found: error
